[package]
name = "electricity_anti_lag_ultimate"
version = "2.0.0"
edition = "2021"

[dependencies]
eframe = "0.27.0"
rand = "0.8.5"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media",
    "Win32_Security"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
