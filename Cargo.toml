[package]
name = "hermes-engine"
version = "4.0.0"
edition = "2021"
description = "Hermes Engine Ultimate — 3-layer PLL + adaptive spin + reversible system tuners"
license = "MIT"

[lib]
name = "hermes_engine"
path = "src/lib.rs"

[[bin]]
name = "hermes-engine"
path = "src/main.rs"

[[bin]]
name = "hermes-bench"
path = "src/bin/hermes-bench.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_plot = "0.29"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
